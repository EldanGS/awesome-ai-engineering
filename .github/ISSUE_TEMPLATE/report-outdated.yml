name: Report outdated content
description: Report a dead link, archived repository, retired exam or wrong exam facts.
labels: ["outdated"]
body:
  - type: input
    id: item
    attributes:
      label: Item
      description: Name or link of the outdated item.
    validations:
      required: true
  - type: textarea
    id: details
    attributes:
      label: What is wrong?
      description: Include an official source for the correct information, if possible.
    validations:
      required: true
